[project]
name = "devkit-flow"
version = "0.1.0"
description = "Spec-driven development workflow for coding agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "devkit contributors" }]

[project.scripts]
devkit-flow = "devkit_flow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
